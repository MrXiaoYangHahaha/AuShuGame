<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奖励商店 · 学习勇士</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(180deg,#312e81 0%,#1e1b4b 45%,#0f0f23 100%);min-height:100vh;color:#fff;padding:0 0 40px;user-select:none}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.back{width:38px;height:38px;border-radius:12px;border:1px solid rgba(139,92,246,.4);background:rgba(30,27,75,.8);color:#c7d2fe;font-size:18px;cursor:pointer;flex-shrink:0}
.ttl{font-size:19px;font-weight:bold;flex:1}
.bal{display:flex;align-items:center;gap:5px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.45);color:#fcd34d;font-size:14px;font-weight:bold;padding:7px 12px;border-radius:20px;white-space:nowrap}
.hero{margin:8px 0 18px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(30,27,75,.9));border:1px solid rgba(251,191,36,.35);display:flex;align-items:center;gap:14px}
.hero .big{font-size:40px}
.hero .txt b{font-size:26px;color:#fcd34d}
.hero .txt p{font-size:12px;color:#c7d2fe;margin-top:4px}
.sec{font-size:13px;font-weight:bold;color:#a5b4fc;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
.item{display:flex;align-items:center;gap:12px;background:rgba(30,27,75,.82);border:1px solid rgba(139,92,246,.28);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item.pend{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.07)}
.item.appr{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08)}
.ico{font-size:28px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:bold;margin-bottom:3px}
.desc{font-size:11.5px;color:#94a3b8}
.price{font-size:12px;color:#fcd34d;margin-top:4px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;flex-shrink:0}
.btn:disabled{background:rgba(100,116,139,.35);color:#94a3b8;cursor:not-allowed}
.btn.green{background:linear-gradient(135deg,#34d399,#10b981)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-top:5px}
.tag.p{background:rgba(251,191,36,.18);color:#fcd34d}
.tag.a{background:rgba(16,185,129,.18);color:#6ee7b7}
.empty{text-align:center;color:#64748b;font-size:13px;padding:26px 0}
.foot{text-align:center;color:#64748b;font-size:11.5px;margin-top:26px;line-height:1.9}
.foot a{color:#818cf8;text-decoration:none}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.96);border:1px solid rgba(139,92,246,.5);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='index.html'">←</button>
    <div class="ttl">🎁 奖励商店</div>
    <div class="bal">⭐ <span id="balance">0</span></div>
  </div>

  <div class="hero">
    <div class="big">🏦</div>
    <div class="txt">
      <b id="big-bal">0</b> <span style="font-size:13px;color:#fcd34d">颗智慧星</span>
      <p>三个游戏的星星都存这里，一起花</p>
    </div>
  </div>

  <div id="list"></div>

  <div class="foot">
    兑换后需家长在「家长中心」确认<br/>
    <a href="index.html">← 返回游戏大厅</a>
  </div>
</div>
<div id="toast"></div>

<script src="sg-account.js"></script>
<script>
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2200);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
  var a=SG.reload();
  var stars=a.stars;
  document.getElementById('balance').textContent=stars;
  document.getElementById('big-bal').textContent=stars;

  var h='';

  if(a.pending.length){
    h+='<div class="sec">⏳ 等家长确认</div>';
    a.pending.forEach(function(r){
      h+='<div class="item pend"><div class="ico">'+esc(r.icon)+'</div><div class="info">'
        +'<div class="name">'+esc(r.name)+'</div><div class="desc">消耗 '+r.price+' ⭐ · '+esc(r.date||'')+'</div>'
        +'<span class="tag p">等待家长审核</span></div></div>';
    });
  }

  var active=a.approved.filter(function(r){return a.used.indexOf(r.id)<0});
  if(active.length){
    h+='<div class="sec">✅ 已获得 · 可以用啦</div>';
    active.forEach(function(r){
      h+='<div class="item appr"><div class="ico">'+esc(r.icon)+'</div><div class="info">'
        +'<div class="name">'+esc(r.name)+'</div><div class="desc">家长已批准，用完记得点「用掉了」</div>'
        +'<span class="tag a">已批准</span></div>'
        +'<button class="btn green" onclick="useIt(\''+r.id+'\')">用掉了</button></div>';
    });
  }

  h+='<div class="sec">🎁 可以兑换</div>';
  if(!a.rewards.length) h+='<div class="empty">家长还没设置奖励</div>';
  a.rewards.forEach(function(r){
    var can=stars>=r.price;
    h+='<div class="item"><div class="ico">'+esc(r.icon)+'</div><div class="info">'
      +'<div class="name">'+esc(r.name)+'</div><div class="desc">'+esc(r.desc||'')+'</div>'
      +'<div class="price">'+r.price+' ⭐'+(r.auto?' · 自动批准':'')+'</div></div>'
      +'<button class="btn" '+(can?'':'disabled')+' onclick="redeem(\''+r.id+'\')">兑换</button></div>';
  });

  document.getElementById('list').innerHTML=h;
}

function redeem(id){
  var res=SG.redeem(id);
  if(!res.ok){toast('😢 '+res.msg);return}
  toast(res.auto?'✅ '+res.msg:'⏳ '+res.msg);
  render();
}
function useIt(id){
  if(!confirm('确定已经用掉这个奖励了吗？'))return;
  SG.useReward(id);
  toast('🎉 奖励已使用');
  render();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
render();
</script>
</body>
</html>
