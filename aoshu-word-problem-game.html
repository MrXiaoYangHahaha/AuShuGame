<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>奥数应用题闯关 · 第5~6讲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Microsoft YaHei','PingFang SC',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;color:#e0e7ff}
#app{width:100%;max-width:520px;min-height:100vh;background:#0f0f23;position:relative;box-shadow:0 0 40px rgba(99,102,241,.25);display:flex;flex-direction:column}
@media(min-width:561px){#app{border-radius:18px;margin:20px 0;min-height:calc(100vh - 40px);overflow:hidden}}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}

/* ---------- 顶部条 ---------- */
.top-bar{background:linear-gradient(90deg,#4338ca,#6d28d9);color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;position:sticky;top:0;z-index:20;flex-shrink:0}
.top-bar .ttl{font-weight:bold;font-size:15px}
.back-btn{background:none;border:none;color:#fff;font-size:19px;cursor:pointer;padding:2px 8px;line-height:1}
.cnt{font-size:12px;color:#ddd6fe}
.prog{height:4px;background:#1e1b4b;flex-shrink:0;position:sticky;top:46px;z-index:19}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,#f472b6,#8b5cf6);transition:width .35s}

/* ---------- 主菜单 ---------- */
#menu{padding:0 0 30px}
.hero{text-align:center;padding:34px 20px 20px}
.hero .ico{font-size:60px;display:block;margin-bottom:12px;animation:bounce 2.6s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero h1{font-size:26px;color:#fff;text-shadow:0 0 22px rgba(139,92,246,.65);letter-spacing:1px}
.hero p{color:#a5b4fc;font-size:13px;margin-top:8px;line-height:1.7}
.sg-chip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 16px;border-radius:20px;background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.4);color:#fcd34d;font-size:13px;font-weight:bold;cursor:pointer}
.ch-list{padding:6px 16px}
.ch-card{background:linear-gradient(135deg,rgba(67,56,202,.34),rgba(30,27,75,.95));border:1px solid rgba(139,92,246,.4);border-radius:16px;padding:16px;margin-bottom:13px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.ch-card:active{transform:scale(.985)}
.ch-card:hover{box-shadow:0 8px 22px rgba(99,102,241,.32)}
.ch-card .row1{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ch-card .num{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:#fff;flex-shrink:0}
.ch-card .nm{font-size:16px;font-weight:bold;color:#fff}
.ch-card .ds{font-size:12px;color:#a5b4fc;line-height:1.65;padding-left:44px}
.ch-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-left:44px;font-size:11.5px;color:#818cf8}
.ch-card .done-tag{background:rgba(16,185,129,.18);color:#34d399;border:1px solid rgba(16,185,129,.45);padding:2px 9px;border-radius:9px;font-size:11px}
.ch-card .pbar{height:5px;background:#312e81;border-radius:3px;margin-top:9px;margin-left:44px;overflow:hidden}
.ch-card .pbar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#10b981);width:0}
.tip-card{margin:16px;padding:14px;background:rgba(30,27,75,.75);border:1px dashed rgba(139,92,246,.45);border-radius:14px}
.tip-card b{color:#c4b5fd;font-size:13px;display:block;margin-bottom:8px}
.tip-card p{color:#94a3b8;font-size:12px;line-height:1.9}
.menu-foot{text-align:center;color:#475569;font-size:11px;margin-top:14px;line-height:1.9}
.menu-foot a{color:#64748b;text-decoration:none}

/* ---------- 答题 ---------- */
.body{padding:16px 16px 60px;flex:1}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.qtag{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;font-size:11.5px;font-weight:bold;padding:3px 11px;border-radius:9px}
.qname{font-size:15px;font-weight:bold;color:#e0e7ff}
.qtext{background:#1e1b4b;border-left:4px solid #8b5cf6;border-radius:0 12px 12px 0;padding:14px 15px;font-size:15.5px;line-height:2;color:#e8ecff;letter-spacing:.2px}
.hint-btn{width:100%;margin-top:12px;padding:11px;background:rgba(251,191,36,.1);border:1px dashed rgba(251,191,36,.5);color:#fbbf24;border-radius:12px;font-size:13.5px;font-family:inherit;cursor:pointer}
.hint-btn.on{background:rgba(251,191,36,.2);border-style:solid}
/* 小提示：气泡 */
.bubble-wrap{display:none;margin-top:14px;position:relative}
.bubble-wrap.on{display:block;animation:bubblePop .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes bubblePop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
.bubble{position:relative;background:linear-gradient(165deg,#fffbeb,#fde68a);border:1px solid #fbbf24;border-radius:16px;padding:14px 34px 14px 16px;font-size:13.5px;line-height:2;color:#3f2a08;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.bubble:before{content:'';position:absolute;top:-7px;left:26px;width:13px;height:13px;background:#fffbeb;border-left:1px solid #fbbf24;border-top:1px solid #fbbf24;transform:rotate(45deg);border-radius:2px 0 0 0}
.bubble .bl{display:block;font-size:11px;font-weight:bold;color:#b45309;letter-spacing:1px;margin-bottom:5px}
.bubble b{color:#92400e}
.bubble .bx{position:absolute;top:7px;right:9px;width:22px;height:22px;border:none;background:rgba(180,83,9,.12);color:#92400e;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
.bubble .bx:active{transform:scale(.92)}
.bubble .bplay{display:inline-block;margin-top:10px;padding:5px 13px;border:1px solid rgba(180,83,9,.32);background:rgba(255,255,255,.62);color:#92400e;font-size:11.5px;border-radius:20px;font-family:inherit;cursor:pointer}
.bubble .bplay:active{transform:scale(.96)}
.ta-label{font-size:12.5px;color:#a5b4fc;margin:16px 0 8px}
textarea#ans-input{width:100%;min-height:170px;background:#151a33;border:2px solid #3730a3;border-radius:14px;padding:13px 14px;color:#e8ecff;font-size:15px;line-height:1.95;font-family:inherit;resize:vertical;outline:none}
textarea#ans-input::placeholder{color:#4c5480}
textarea#ans-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.btn-answer{width:100%;margin-top:14px;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 5px 18px rgba(217,119,6,.35)}
.btn-answer:active{transform:scale(.985)}
.btn-answer:disabled{background:#334155;box-shadow:none;color:#64748b}

/* ---------- 解答 ---------- */
.answer{margin-top:20px;background:#101a2b;border:1px solid rgba(16,185,129,.32);border-radius:16px;padding:0 0 18px;overflow:hidden;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans-hd{background:linear-gradient(90deg,rgba(16,185,129,.22),rgba(16,185,129,.04));padding:11px 15px;font-size:14.5px;font-weight:bold;color:#6ee7b7;border-bottom:1px solid rgba(16,185,129,.2)}
.sec-t{font-size:13.5px;font-weight:bold;color:#c4b5fd;margin:16px 15px 9px}
ul.pts{margin:0 15px;padding-left:0;list-style:none}
ul.pts li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.95;color:#cbd5e1;margin-bottom:7px}
ul.pts li:before{content:'';position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:#8b5cf6}
ul.pts li b{color:#fbbf24;font-weight:bold}
.dia{margin:14px 15px;background:#0b1120;border:1px solid #1e293b;border-radius:12px;padding:12px 8px 8px}
.dia svg{width:100%;height:auto;display:block}
.dia-cap{font-size:11.5px;color:#7c8bb0;text-align:center;line-height:1.7;margin-top:7px;padding:0 6px}
.step{display:flex;gap:11px;margin:0 15px 12px}
.sn{width:23px;height:23px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sb{flex:1;min-width:0}
.st{font-size:13.5px;color:#e2e8f7;line-height:1.7;font-weight:bold}
.sm{display:inline-block;margin-top:6px;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35);border-radius:8px;padding:5px 11px;font-size:14px;color:#ddd6fe;font-family:'Consolas',monospace;letter-spacing:.5px;line-height:1.6}
.sd{font-size:12.5px;color:#8b98b8;line-height:1.8;margin-top:6px}
.check{margin:4px 15px 0;background:rgba(16,185,129,.08);border:1px dashed rgba(16,185,129,.4);border-radius:12px;padding:4px 13px 12px}
.check .sec-t{margin-left:0;margin-right:0;color:#6ee7b7}
.ck{font-size:13px;color:#a7f3d0;line-height:1.9}
.final{margin:16px 15px 0;background:linear-gradient(135deg,rgba(236,72,153,.2),rgba(139,92,246,.2));border:1px solid rgba(236,72,153,.5);border-radius:12px;padding:13px 15px;font-size:16px;font-weight:bold;color:#fff;line-height:1.7}
.pitfall{margin:14px 15px 0;background:rgba(239,68,68,.08);border-left:3px solid #ef4444;border-radius:0 10px 10px 0;padding:11px 13px;font-size:12.5px;color:#fca5a5;line-height:1.9}
.pitfall b{color:#f87171}
.btn-next{display:block;width:calc(100% - 30px);margin:18px 15px 0;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#34d399,#10b981);color:#04231a;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 5px 18px rgba(16,185,129,.35)}
.btn-next:active{transform:scale(.985)}
.btn-next.fin{background:linear-gradient(135deg,#f472b6,#a855f7);color:#fff;box-shadow:0 5px 20px rgba(168,85,247,.4)}

/* ---------- 完成页 ---------- */
#done{align-items:center;justify-content:center;padding:30px 22px;text-align:center}
#done .big{font-size:72px;animation:bounce 2s infinite}
#done h2{font-size:23px;color:#fff;margin:16px 0 10px;text-shadow:0 0 18px rgba(139,92,246,.6)}
#done p{color:#a5b4fc;font-size:14px;line-height:2}
.done-acts{margin-top:28px;width:100%;max-width:330px}
.done-acts button{width:100%;padding:14px;border:none;border-radius:13px;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;margin-bottom:11px;color:#fff}
.bp{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.bs{background:#334155;color:#cbd5e1 !important}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(30,27,75,.96);border:1px solid #8b5cf6;color:#e0e7ff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
.toast.show{opacity:1}
</style>

<div id="app">

  <!-- ========== 主菜单 ========== -->
  <div id="menu" class="screen active">
    <div class="hero">
      <span class="ico">📝</span>
      <h1>奥数应用题闯关</h1>
      <p>四年级上册 · 第 5~6 讲<br/>把题目读懂 → 画线段 → 数份数 → 算出来</p>
      <div class="sg-chip" onclick="location.href='reward-shop.html'">⭐ <span id="sg-stars">0</span> 颗智慧星</div>
    </div>
    <div class="ch-list" id="ch-list"></div>
    <div class="tip-card">
      <b>🔑 解题三句口诀</b>
      <p>1. 谁最小，谁当 1 份；<br/>2. 其他对象都翻译成"几份 + 多几（或少几）"；<br/>3. 份数相加，零头相减，剩下的平均分。</p>
    </div>
    <div class="menu-foot">
      不会做也没关系，先随便写一写自己的想法，<br/>再点"参考答案"看看别人是怎么想的。<br/><br/>

    <div class="done-acts">
      <button class="bp" id="done-next" onclick="nextChapter()">挑战下一章 →</button>
      <button class="bs" onclick="backToMenu()">返回章节列表</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="sg-account.js"></script>
<script>
/* =========================================================
   一、线段图渲染器
   rows: [{name, segs:[{w,t,k,top}]}]
   k: c1紫 c2蓝 c3青 c4绿 tail橙(零头) ghost红虚线(少) q紫虚线(未知)
   ========================================================= */
const SEG = {
  c1:{fill:'#6d28d9',stroke:'#a78bfa'},
  c2:{fill:'#1d4ed8',stroke:'#60a5fa'},
  c3:{fill:'#0e7490',stroke:'#22d3ee'},
  c4:{fill:'#4d7c0f',stroke:'#a3e635'},
  tail:{fill:'#b45309',stroke:'#fbbf24'},
  ghost:{fill:'rgba(239,68,68,.10)',stroke:'#ef4444'},
  q:{fill:'#1e1b4b',stroke:'#c4b5fd'}
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bar(cfg){
  const W=470, LEFT=96, RIGHT=12, TOP=26, ROW=58, BARH=27;
  const rows=cfg.rows||[];
  let maxW=0;
  rows.forEach(r=>{let s=0;(r.segs||[]).forEach(g=>{s+=(g.w||0)});if(s>maxW)maxW=s;});
  if(!maxW)maxW=1;
  const px=(W-LEFT-RIGHT)/maxW;
  const H=TOP+rows.length*ROW+4;
  const o=[]; const info=[]; let y=TOP;
  rows.forEach(r=>{
    const ry=y; let x=LEFT; const end0={x:LEFT};
    const nfs=Math.min(12.5, 84/Math.max(4, String(r.name).length));
    o.push('<text x="'+(LEFT-10)+'" y="'+(ry+BARH/2+4.5)+'" text-anchor="end" font-size="'+nfs.toFixed(1)+'" fill="#c7d2fe">'+esc(r.name)+'</text>');
    (r.segs||[]).forEach(g=>{
      const w=(g.w||0)*px;
      const st=SEG[g.k||'c1'];
      const dash=(g.k==='ghost'||g.k==='q')?' stroke-dasharray="5 4"':'';
      // cut: 这一段末尾"缺掉"的长度（"几份少几"要画成完整份数 + 末尾虚线缺口）
      const cutW=(g.cut||0)*px;
      const solidW=Math.max(0,w-cutW);
      if(solidW>0.4) o.push('<rect x="'+x.toFixed(1)+'" y="'+ry+'" width="'+solidW.toFixed(1)+'" height="'+BARH+'" rx="5" fill="'+st.fill+'" stroke="'+st.stroke+'" stroke-width="1.4"'+dash+'/>');
      if(cutW>0.4){
        const cx0=x+solidW;
        o.push('<rect x="'+cx0.toFixed(1)+'" y="'+ry+'" width="'+cutW.toFixed(1)+'" height="'+BARH+'" rx="5" fill="rgba(239,68,68,.14)" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4 3"/>');
        o.push('<line x1="'+cx0.toFixed(1)+'" y1="'+(ry-6)+'" x2="'+cx0.toFixed(1)+'" y2="'+(ry+BARH+6)+'" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="3 3"/>');
        if(g.cutLbl){
          o.push('<text x="'+Math.min(x+w,W-RIGHT).toFixed(1)+'" y="'+(ry+BARH+14)+'" text-anchor="end" font-size="10.5" fill="#fca5a5" stroke="#0b1120" stroke-width="3" paint-order="stroke">'+esc(g.cutLbl)+'</text>');
        }
      }
      if(g.t){
        const avail=cutW>0.4?solidW:w;
        const fs=avail>70?11.5:(avail>46?10.5:9.5);
        // 估一下文字宽度：汉字按 1 个字号，字母数字按 0.56
        let tw=0; String(g.t).split('').forEach(ch=>{tw+=/[\x00-\xff]/.test(ch)?0.56*fs:fs;});
        const onLine=(g.div>1 && g.div%2===0 && cutW<=0.4);   // 偶数份时中点落在分格线上
        if(cutW>30 || onLine || (avail>30 && tw>avail-8)){
          // 缺口明显 / 中点在分格线上 / 色块装不下：标签放到整条上方，不压住格子
          o.push('<text x="'+Math.min(x+w/2,W-RIGHT-2).toFixed(1)+'" y="'+(ry-6)+'" text-anchor="middle" font-size="10.5" fill="#c7d2fe" stroke="#0b1120" stroke-width="3" paint-order="stroke">'+esc(g.t)+'</text>');
        }else if(avail>30){
          const cx=x+avail/2;
          o.push('<text x="'+cx.toFixed(1)+'" y="'+(ry+BARH/2+4)+'" text-anchor="middle" font-size="'+fs+'" fill="'+(g.k==='ghost'?'#fca5a5':'#ffffff')+'" stroke="#0b1120" stroke-width="2.6" paint-order="stroke">'+esc(g.t)+'</text>');
        }else{
          // 太窄放不进色块：写到色块上方，右端对齐，避免超出画布
          const tx=Math.min(x+w, W-RIGHT);
          o.push('<text x="'+tx.toFixed(1)+'" y="'+(ry-6)+'" text-anchor="end" font-size="10.5" fill="#fbbf24" stroke="#0b1120" stroke-width="3" paint-order="stroke">'+esc(g.t)+'</text>');
        }
      }
      // 分格线画在文字之上，保证格子数得清
      if(g.div&&g.div>1&&w>16){
        for(var di=1;di<g.div;di++){
          var dx=x+w*di/g.div;
          if(dx>solidW+x-0.5) continue;   // 缺口里不画分格线
          o.push('<line x1="'+dx.toFixed(1)+'" y1="'+(ry+1.5)+'" x2="'+dx.toFixed(1)+'" y2="'+(ry+BARH-1.5)+'" stroke="rgba(8,10,26,.85)" stroke-width="1.4" stroke-dasharray="3 2.5"/>');
        }
      }
      if(g.top) o.push('<text x="'+(x+w/2).toFixed(1)+'" y="'+(ry-7)+'" text-anchor="middle" font-size="10.5" fill="#a5b4fc">'+esc(g.top)+'</text>');
      x+=w;
    });
    info.push({y:ry,end:x});
    y+=ROW;
  });
  (cfg.vlines||[]).forEach(v=>{
    const a=info[v.from], b=info[v.to];
    if(!a||!b) return;
    const x=a.end;
    const maxLen=W-RIGHT-x-4;
    const est=v.label.length*10.2;
    const anchor=est>maxLen?'end':'start';
    const lx=anchor==='end'?(x-6):(x+6);
    o.push('<line x1="'+x.toFixed(1)+'" y1="'+(a.y+BARH)+'" x2="'+x.toFixed(1)+'" y2="'+b.y+'" stroke="#f87171" stroke-width="1.3" stroke-dasharray="4 4"/>');
    const ly=Math.min((a.y+BARH+b.y)/2+4, a.y+BARH+13);
    o.push('<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" font-size="10.5" fill="#f87171" stroke="#0b1120" stroke-width="3" paint-order="stroke">'+esc(v.label)+'</text>');
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+o.join('')+'</svg>';
}

/* =========================================================
   二、题库
   ========================================================= */
const DATA = [
{
  id:'c5',
  title:'第 5 讲',
  full:'第 5 讲　和差倍中的隐藏条件',
  desc:'题目里的数量一直在变，但总有一个量偷偷没变。抓住它，题目就变简单了。',
  qs:[
  {
    id:'c5q1', tag:'例题 1', name:'棋子对局',
    text:'小高和墨莫玩游戏，每玩一局，输的就要给赢的一枚棋子。一开始小高有 18 枚棋子，墨莫则有 22 枚。玩了若干局之后，小高反而比墨莫多了 10 枚棋子。请问：此时小高有多少枚棋子？',

let curCh=0, curQ=0, revealed=false, noAutoScroll=false;

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
  var el=document.getElementById(id);
  if(el)el.classList.add('active');
  window.scrollTo(0,0);
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},1600);
}

  DATA.forEach(function(ch,i){
    var total=ch.qs.length;
    var done=ch.qs.filter(function(q){return store.read[q.id]}).length;
    var pct=total?Math.round(done/total*100):0;
    html+='<div class="ch-card" onclick="openChapter('+i+')">'
      +'<div class="row1"><div class="num">'+ch.title.replace('第 ','').replace(' 讲','')+'</div>'
      +'<div class="nm">'+ch.full+'</div></div>'
      +'<div class="ds">'+ch.desc+'</div>'
      +'<div class="pbar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="meta"><span>共 '+total+' 道题</span>'
      +(done>=total?'<span class="done-tag">✓ 已全部完成</span>':'<span>已看解答 '+done+' / '+total+'</span>')
      +'</div></div>';
  });
  list.innerHTML=html;
}

function openChapter(i,qi){
  curCh=i;curQ=(qi||0);revealed=false;
  show('ch');
  renderQ();
}
function backToMenu(){renderMenu();show('menu');}

/* ---------- 语音播报（提示气泡朗读） ---------- */
var speechOK = (typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined');
function plainText(s){
  return String(s)
    .replace(/<br\s*\/?>/gi,'，')
    .replace(/<[^>]*>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
    .replace(/[→➡⇒]/g,'，')
    // 把算式符号念出来，别让 TTS 只读数字
    .replace(/\+/g,'加').replace(/=/g,'等于')
    .replace(/\u2212/g,'减')
    .replace(/(\d)\s*-\s*(\d)/g,'$1减$2')
    .replace(/×/g,'乘').replace(/÷/g,'除以')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu,'')
    .replace(/([\u4e00-\u9fa5])\s+(?=[\u4e00-\u9fa5])/g,'$1')
    .replace(/\s+/g,' ')
    .trim();
}
function pickZhVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    if(!vs.length) return null;
    for(var i=0;i<vs.length;i++){ if(/zh[-_]?(CN|Hans)/i.test(vs[i].lang)) return vs[i]; }
    for(var j=0;j<vs.length;j++){ if(/^zh/i.test(vs[j].lang)) return vs[j]; }
    return null;
  }catch(e){ return null; }
}
function speakText(txt){
  if(!speechOK||!txt) return;
  try{
    window.speechSynthesis.cancel();
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN'; u.rate=0.92; u.pitch=1.05; u.volume=1;
    var v=pickZhVoice(); if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){
  if(!speechOK) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
}
function speakHint(){
  var ch=DATA[curCh], q=ch&&ch.qs[curQ];
  if(!q||!q.points||!q.points.length){ stopSpeak(); return; }
  speakText('提示：'+plainText(q.points[0]));
}

function renderQ(){
  stopSpeak();
  var ch=DATA[curCh], q=ch.qs[curQ];
  document.getElementById('ch-title').textContent=ch.title;
  document.getElementById('ch-count').textContent=(curQ+1)+' / '+ch.qs.length;
  document.getElementById('prog-fill').style.width=((curQ)/ch.qs.length*100)+'%';

  var body=document.getElementById('ch-body');
  var h='';
  h+='<div class="qhead"><span class="qtag">'+q.tag+'</span><span class="qname">'+q.name+'</span></div>';
  h+='<div class="qtext">'+esc(q.text).replace(/\n/g,'<br/>')+'</div>';
  if(q.points&&q.points.length){
    h+='<button class="hint-btn" id="hint-btn" onclick="toggleBubble()">💡 卡住了？点这里提示一下</button>';
    h+='<div class="bubble-wrap" id="bubble-wrap"><div class="bubble">'
      +'<button class="bx" onclick="toggleBubble(false)" aria-label="收起">✕</button>'
      +'<span class="bl">💡 小提示</span>'+q.points[0]
      +(speechOK?'<button class="bplay" id="bplay" onclick="speakHint()">🔊 再听一遍</button>':'')
      +'</div></div>';
  }
  h+='<div class="ta-label">✏️ 我的做法（可以先画一画线段，再算一算）</div>';
  h+='<textarea id="ans-input" placeholder="在这里写下你的想法和算式……&#10;不会做也没关系，随便写两句也可以。"></textarea>';
  h+='<button class="btn-answer" id="btn-answer" onclick="revealAnswer()">📖 参考答案</button>';
  h+='<div id="answer-box"></div>';
  body.innerHTML=h;

  var ta=document.getElementById('ans-input');
  if(store.draft[q.id]) ta.value=store.draft[q.id];
  ta.addEventListener('input',function(){
    store.draft[q.id]=ta.value;persist();
  });
  window.scrollTo(0,0);
}

function toggleBubble(force){
  var w=document.getElementById('bubble-wrap');
  var b=document.getElementById('hint-btn');
  if(!w)return;
  var on=(typeof force==='boolean')?force:!w.classList.contains('on');
  w.classList.toggle('on',on);
  if(b){b.classList.toggle('on',on);b.textContent=on?'💡 收起小提示':'💡 卡住了？点这里提示一下';}
  if(on) speakHint(); else stopSpeak();
}

function revealAnswer(){
  if(revealed)return;
  revealed=true;
  toggleBubble(false);
  var hb=document.getElementById('hint-btn');
  if(hb) hb.style.display='none';
  var ch=DATA[curCh], q=ch.qs[curQ];
  var isLast=(curQ===ch.qs.length-1);

  var firstRead=!store.read[q.id];
  store.read[q.id]=true;persist();
  // 第一次看这道题的解答，给 5 颗智慧星（存入统一账户，三个游戏共用）
  if(firstRead&&window.SG&&!/[?&]dia=1/.test(location.search)){
    try{SG.addStars(5,'应用题 '+q.id);renderStars();}catch(e){}
  }

  if(/[?&]dia=1/.test(location.search)){
    var dh='';
    (q.diagrams||[]).forEach(function(d){dh+='<div class="dia">'+d.svg+'<div class="dia-cap">'+d.cap+'</div></div>';});
    document.getElementById('answer-box').innerHTML=dh;
    var db=document.getElementById('btn-answer');db.disabled=true;db.textContent='✓';
    return;
  }

  var h='<div class="answer">';
  h+='<div class="ans-hd">📖 参考解答</div>';
  h+='<div class="sec-t">🔑 关键点</div><ul class="pts">';
  q.points.forEach(function(p){h+='<li>'+p+'</li>'});
  h+='</ul>';

  if(q.diagrams&&q.diagrams.length){
    h+='<div class="sec-t">📐 画个线段图想一想</div>';
    q.diagrams.forEach(function(d){
      h+='<div class="dia">'+d.svg+'<div class="dia-cap">'+d.cap+'</div></div>';
    });
  }

  h+='<div class="sec-t">🧮 一步一步算</div>';
  q.steps.forEach(function(s,i){
    h+='<div class="step"><div class="sn">'+(i+1)+'</div><div class="sb">'
      +'<div class="st">'+s.h+'</div>'
      +(s.m?'<div class="sm">'+s.m.replace(/\n/g,'<br/>')+'</div>':'')
      +(s.d?'<div class="sd">'+s.d+'</div>':'')
      +'</div></div>';
  });

  if(q.check&&q.check.length){
    h+='<div class="check"><div class="sec-t">✅ 回头验算一下</div>';
    q.check.forEach(function(c){h+='<div class="ck">'+c+'</div>'});
    h+='</div>';
  }

  h+='<div class="final">🎯 答案：'+q.answer+'</div>';
  if(q.pitfall) h+='<div class="pitfall"><b>⚠️ 易错点</b><br/>'+q.pitfall+'</div>';

  var btnTxt=isLast?'🎉 已完成本章所有题目，恭喜你！':'下一题 →';
  h+='<button class="btn-next'+(isLast?' fin':'')+'" onclick="nextQ()">'+btnTxt+'</button>';
  h+='</div>';

  document.getElementById('answer-box').innerHTML=h;
  var b=document.getElementById('btn-answer');
  b.disabled=true;b.textContent='✓ 答案已展开';

  setTimeout(function(){
    if(noAutoScroll)return;
    var box=document.getElementById('answer-box');
    if(box)box.scrollIntoView({behavior:'smooth',block:'start'});
  },80);
}

function nextQ(){
  var ch=DATA[curCh];
  if(curQ<ch.qs.length-1){
    curQ++;revealed=false;renderQ();
  }else{
    finishChapter();
  }
}

function finishChapter(){
  var ch=DATA[curCh];
  var done=ch.qs.filter(function(q){return store.read[q.id]}).length;
  document.getElementById('done-title').textContent=ch.title+' 全部完成！';
  document.getElementById('done-sub').innerHTML='共 '+ch.qs.length+' 道题，你已经看完了 '+done+' 道。<br/>'
    +'记住这三步：<b>打包</b> → <b>定 1 份</b> → <b>份数相加、零头相减</b>。';
  var nb=document.getElementById('done-next');
  if(curCh<DATA.length-1){nb.style.display='block';nb.textContent='挑战下一章：'+DATA[curCh+1].title+' →';}
  else{nb.style.display='none';}
  if(curCh<DATA.length-1){nb.onclick=function(){openChapter(curCh+1,0)};}
  show('done');
}
function nextChapter(){
  if(curCh<DATA.length-1)openChapter(curCh+1,0);
  else backToMenu();
}

/* =========================================================
   四、深链接：?q=c5q2&show=1 直接打开某题的解答（便于截图/分享）
   ========================================================= */
function renderStars(){
  var el=document.getElementById('sg-stars');
  if(!el)return;
  try{el.textContent=(window.SG?SG.refresh():0)}catch(e){el.textContent=0}
}

function boot(){
  renderMenu();
  renderStars();
  try{
    var p=new URLSearchParams(location.search);
    var qid=p.get('q');
    if(qid){
      for(var i=0;i<DATA.length;i++){
        for(var j=0;j<DATA[i].qs.length;j++){
          if(DATA[i].qs[j].id===qid){
            openChapter(i,j);
            if(p.get('show')==='1'){noAutoScroll=true;setTimeout(revealAnswer,120);}
            return;
          }
        }
      }
    }
  }catch(e){}
}
boot();
</script>
