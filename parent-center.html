<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家长中心 · 学习勇士</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(180deg,#312e81 0%,#1e1b4b 45%,#0f0f23 100%);min-height:100vh;color:#fff;padding:0 0 40px;user-select:none}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.back{width:38px;height:38px;border-radius:12px;border:1px solid rgba(139,92,246,.4);background:rgba(30,27,75,.8);color:#c7d2fe;font-size:18px;cursor:pointer;flex-shrink:0}
.ttl{font-size:19px;font-weight:bold;flex:1}
/* 锁屏 */
.gate{max-width:330px;margin:70px auto 0;text-align:center}
.gate .ico{font-size:54px;margin-bottom:14px}
.gate h2{font-size:19px;margin-bottom:8px}
.gate p{font-size:12.5px;color:#94a3b8;margin-bottom:20px}
.gate input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(139,92,246,.45);background:rgba(15,15,35,.85);color:#fff;font-size:17px;text-align:center;letter-spacing:6px;font-family:inherit;outline:none}
.gate input:focus{border-color:#8b5cf6}
.gate button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer}
/* 主体 */
.card{background:rgba(30,27,75,.82);border:1px solid rgba(139,92,246,.28);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;color:#a5b4fc;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{font-size:13px;color:#cbd5e1;width:88px;flex-shrink:0}
.row input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(139,92,246,.35);background:rgba(15,15,35,.8);color:#fff;font-size:14px;font-family:inherit;outline:none;min-width:0}
.row input:focus{border-color:#8b5cf6}
.stat{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(139,92,246,.22);font-size:13.5px}
.stat:last-child{border:none}
.stat b{color:#fcd34d;font-size:18px}
.btn{border:none;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn.gray{background:rgba(100,116,139,.35);color:#cbd5e1}
.btn.green{background:linear-gradient(135deg,#34d399,#10b981)}
.btn.red{background:linear-gradient(135deg,#f87171,#dc2626)}
.btn.sm{padding:7px 12px;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rw{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.rw input[type=text]{flex:1;min-width:0}
.rw input{padding:8px 10px;border-radius:9px;border:1px solid rgba(139,92,246,.3);background:rgba(15,15,35,.8);color:#fff;font-size:13px;font-family:inherit;outline:none}
.rw .i{width:44px;text-align:center;flex:none}
.rw .p{width:62px;flex:none}
.rw .x{width:32px;height:32px;flex:none;border-radius:9px;border:none;background:rgba(248,113,113,.2);color:#fca5a5;font-size:16px;cursor:pointer}
.pend{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);margin-bottom:8px}
.pend .ico{font-size:24px}
.pend .inf{flex:1;min-width:0}
.pend .nm{font-size:13.5px;font-weight:bold}
.pend .mt{font-size:11.5px;color:#94a3b8;margin-top:2px}
.logrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px dashed rgba(139,92,246,.18)}
.logrow span:first-child{color:#cbd5e1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .d{font-weight:bold;flex-shrink:0}
.plus{color:#6ee7b7}.minus{color:#fca5a5}
.empty{text-align:center;color:#64748b;font-size:12.5px;padding:22px 0}
.foot{text-align:center;color:#64748b;font-size:11.5px;margin-top:22px;line-height:1.9}
.foot a{color:#818cf8;text-decoration:none}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.96);border:1px solid rgba(139,92,246,.5);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='index.html'">←</button>
    <div class="ttl">👨‍👩‍👧 家长中心</div>
  </div>

  <div id="gate" class="gate">
    <div class="ico">🔒</div>
    <h2>请输入家长密码</h2>
    <p>初始密码 1234，进入后可修改</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button onclick="tryLogin()">进入家长中心</button>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <h3>⭐ 积分（三个游戏共用）</h3>
      <div class="stat"><span>当前智慧星</span><b id="cur-stars">0</b></div>
      <div class="stat"><span>累计获得</span><span id="cur-total">0</span></div>
      <div class="stat"><span>待审核申请</span><span id="cur-pend">0</span></div>
      <div class="row" style="margin-top:14px">
        <label>改成</label>
        <input id="set-stars" type="number" min="0" placeholder="直接设定积分">
        <button class="btn sm" onclick="applyStars()">保存</button>
      </div>
      <div class="acts">
        <button class="btn gray sm" onclick="quick(-10)">−10</button>
        <button class="btn gray sm" onclick="quick(-50)">−50</button>
        <button class="btn gray sm" onclick="quick(10)">+10</button>
        <button class="btn gray sm" onclick="quick(50)">+50</button>
      </div>
    </div>

    <div class="card">
      <h3>⏳ 兑换审核</h3>
      <div id="audit"></div>
    </div>

    <div class="card">
      <h3>🎁 奖励清单</h3>
      <div id="rw-list"></div>
      <div class="acts" style="margin-top:10px">
        <button class="btn sm" onclick="addReward()">+ 加一项</button>
        <button class="btn green sm" onclick="saveRewards()">保存清单</button>
      </div>
    </div>

    <div class="card">
      <h3>⚙️ 游戏设置</h3>
      <div class="row">
        <label>每天时长</label>
        <input id="set-time" type="number" min="0" placeholder="分钟，0=不限制">
        <button class="btn sm" onclick="saveTime()">保存</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label>全部解锁</label>
        <button class="btn sm" id="unlock-btn" onclick="toggleUnlock()">开启</button>
        <span style="font-size:11.5px;color:#94a3b8;flex:1">开启后所有单元直接可玩</span>
      </div>
      <div class="row" style="margin-top:6px">
        <label>新密码</label>
        <input id="set-pin" type="password" inputmode="numeric" maxlength="8" placeholder="至少 4 位">
        <button class="btn sm" onclick="savePin()">修改</button>
      </div>
    </div>

    <div class="card">
      <h3>📋 积分明细</h3>
      <div id="log"></div>
    </div>

    <div class="card">
      <h3>🧹 重置</h3>
      <div class="acts">
        <button class="btn gray sm" onclick="resetStars()">积分清零</button>
        <button class="btn red sm" onclick="resetAll()">全部重置</button>
      </div>
      <p style="font-size:11.5px;color:#94a3b8;margin-top:10px;line-height:1.7">
        「积分清零」只清积分与兑换记录，奖励清单和密码保留。<br/>
        「全部重置」会恢复出厂状态（含奖励清单、密码）。
      </p>
    </div>

    <div class="foot"><a href="index.html">← 返回游戏大厅</a></div>
  </div>
</div>
<div id="toast"></div>

<script src="sg-account.js"></script>
<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(x){return Math.max(0,Math.floor(Number(x)||0))}

var unlocked=false;

function tryLogin(){
  var v=document.getElementById('pin').value;
  if(SG.checkPin(v)){unlocked=true;document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block';render()}
  else toast('密码不对，再试一次');
}
document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin()});

function render(){
  if(!unlocked)return;
  var a=SG.reload();
  document.getElementById('cur-stars').textContent=a.stars;
  document.getElementById('cur-total').textContent=a.totalEarned||0;
  document.getElementById('cur-pend').textContent=a.pending.length;
  document.getElementById('set-stars').placeholder='当前 '+a.stars;
  if(!document.getElementById('set-time').value&&a.dailyLimit)document.getElementById('set-time').value=Math.round(a.dailyLimit/60);
  document.getElementById('unlock-btn').textContent=a.unlockAll?'已开启':'开启';
  document.getElementById('unlock-btn').className='btn sm'+(a.unlockAll?' green':'');

  // 审核
  var au=document.getElementById('audit');
  if(!a.pending.length){au.innerHTML='<div class="empty">没有待审核的兑换</div>'}
  else{
    au.innerHTML=a.pending.map(function(r,i){
      return '<div class="pend"><div class="ico">'+esc(r.icon)+'</div><div class="inf">'
        +'<div class="nm">'+esc(r.name)+'</div><div class="mt">'+r.price+' ⭐ · '+esc(r.date||'')+'</div></div>'
        +'<button class="btn green sm" onclick="doAudit('+i+',true)">通过</button>'
        +'<button class="btn gray sm" onclick="doAudit('+i+',false)">拒绝</button></div>';
    }).join('');
  }

  // 奖励清单
  var rl=document.getElementById('rw-list');
  rl.innerHTML=a.rewards.map(function(r,i){
    return '<div class="rw">'
      +'<input class="i" type="text" value="'+esc(r.icon)+'" data-i="'+i+'" data-f="icon">'
      +'<input type="text" value="'+esc(r.name)+'" data-i="'+i+'" data-f="name">'
      +'<input class="p" type="number" value="'+r.price+'" data-i="'+i+'" data-f="price">'
      +'<button class="x" onclick="delReward('+i+')">×</button></div>';
  }).join('')||'<div class="empty">还没有奖励，点下面加一项</div>';

  // 明细
  var lg=document.getElementById('log');
  if(!a.log.length){lg.innerHTML='<div class="empty">还没有记录</div>'}
  else{
    lg.innerHTML=a.log.slice(0,60).map(function(e){
      var d=new Date(e.t);
      var hm=('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
      var sign=e.d>0?'+':'';
      return '<div class="logrow"><span>'+esc(e.r||'——')+'<br/><span style="color:#64748b;font-size:11px">'+hm+'</span></span>'
        +'<span class="d '+(e.d>=0?'plus':'minus')+'">'+sign+e.d+'</span></div>';
    }).join('');
  }
}

function applyStars(){
  var v=document.getElementById('set-stars').value;
  if(v===''||isNaN(v)){toast('请输入数字');return}
  SG.setStars(n(v),'家长设定积分');
  document.getElementById('set-stars').value='';
  toast('✅ 积分已更新');render();
}
function quick(d){SG.addStars(d,d>0?'家长补分':'家长扣分');toast((d>0?'+':'')+d+' 分');render()}

function doAudit(i,ok){
  SG.audit(i,ok);
  toast(ok?'✅ 已通过':'❌ 已拒绝并退分');
  render();
}

function readRewardList(){
  var out=[];
  document.querySelectorAll('#rw-list .rw').forEach(function(row){
    var o={icon:'🎁',name:'',price:10,desc:''};
    row.querySelectorAll('input').forEach(function(inp){
      var f=inp.getAttribute('data-f'),v=inp.value;
      if(f==='price')o.price=n(v)||10; else o[f]=v;
    });
    out.push(o);
  });
  return out;
}
function saveRewards(){
  SG.saveRewards(readRewardList());
  toast('✅ 奖励清单已保存');render();
}
function addReward(){
  var list=readRewardList();
  list.push({icon:'🎁',name:'新奖励',price:50,desc:''});
  SG.saveRewards(list);
  render();toast('已添加，记得改名字');
}
function delReward(i){
  var list=readRewardList();
  list.splice(i,1);
  SG.saveRewards(list);
  render();
}

function saveTime(){
  var m=n(document.getElementById('set-time').value);
  SG.setDailyLimit(m*60);
  toast(m?('✅ 每天 '+m+' 分钟'):'✅ 已取消时长限制');
  render();
}
function toggleUnlock(){
  var on=!SG.unlockAll();
  SG.setUnlockAll(on);
  toast(on?'✅ 已全部解锁':'已关闭全部解锁');
  render();
}
function savePin(){
  var v=document.getElementById('set-pin').value;
  if(v.length<4){toast('密码至少 4 位');return}
  SG.setPin(v);
  document.getElementById('set-pin').value='';
  toast('✅ 密码已修改');
}
function resetStars(){
  if(!confirm('只清空积分和兑换记录，奖励清单保留。确定吗？'))return;
  SG.resetAccount(true);
  toast('已清零');render();
}
function resetAll(){
  if(!confirm('将恢复出厂状态：积分、奖励清单、兑换记录、密码全部重置。确定吗？'))return;
  SG.resetAccount(false);
  toast('已全部重置');render();
}

if(SG.checkPin('')){} // 保持 API 引用，避免误删
render();
</script>
</body>
</html>
