<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>学习勇士 · 游戏大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(180deg,#312e81 0%,#1e1b4b 45%,#0f0f23 100%);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:30px 20px 40px;user-select:none}
.wrap{width:100%;max-width:420px;text-align:center}
.hero{font-size:60px;margin-bottom:8px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:26px;color:#fff;text-shadow:0 0 20px rgba(139,92,246,.6);margin-bottom:6px}
.sub{color:#a5b4fc;font-size:13.5px;margin-bottom:16px}
.bal{display:inline-flex;align-items:center;gap:7px;margin-bottom:22px;padding:9px 18px;border-radius:22px;background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.42);color:#fcd34d;font-size:14px;font-weight:bold;text-decoration:none}
.bal b{font-size:19px}
.card{display:flex;align-items:center;gap:14px;background:rgba(30,27,75,.85);border:1px solid rgba(139,92,246,.35);border-radius:16px;padding:16px 18px;margin-bottom:13px;text-decoration:none;transition:transform .15s,box-shadow .15s;text-align:left}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(99,102,241,.35)}
.card:active{transform:scale(.985)}
.card .icon{font-size:36px;flex-shrink:0}
.card .info{flex:1;min-width:0}
.card .name{font-size:17px;font-weight:bold;color:#fff;margin-bottom:3px}
.card .desc{font-size:12px;color:#a5b4fc;line-height:1.5}
.card .go{color:#c7d2fe;font-size:20px;flex-shrink:0}
.badge{display:inline-block;background:#ec4899;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:2px}
.card.wp{border-color:rgba(251,191,36,.55);background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(30,27,75,.9))}
.card.wp .badge{background:#f59e0b}
.card.shop{border-color:rgba(251,191,36,.4);background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(30,27,75,.9))}
.card.parent{border-color:rgba(148,163,184,.3)}
.divider{display:flex;align-items:center;gap:10px;color:#64748b;font-size:11.5px;margin:18px 0 13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(139,92,246,.25)}
.foot{color:#64748b;font-size:11px;margin-top:20px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">🦉</div>
  <h1>学习勇士 · 游戏大厅</h1>
  <div class="sub">四年级上册 · 英语 + 奥数 每日特训</div>

  <a class="bal" href="reward-shop.html">⭐ 我的智慧星 <b id="bal">0</b> 颗</a>

  <a class="card" href="english-quest-game.html">
    <div class="icon">📚</div>
    <div class="info">
      <div class="name">英语勇士大冒险</div>
      <div class="desc">单词闯关特训 · 听写 · 人教PEP版 Unit 1~6</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="card" href="aoshu-classroom-test-game.html">
    <div class="icon">🧮</div>
    <div class="info">
      <div class="name">奥数勇士大冒险</div>
      <div class="desc">课堂测试特训 · 27关随机出题 · 图形化解题演示</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="card wp" href="aoshu-word-problem-game.html">
    <div class="icon">📝</div>
    <div class="info">
      <div class="name">奥数应用题闯关<span class="badge">NEW</span></div>
      <div class="desc">第5~9讲 · 读题作答 · 线段图分步讲解</div>
    </div>
    <div class="go">›</div>
  </a>

  <div class="divider">积分与设置</div>

  <a class="card shop" href="reward-shop.html">
    <div class="icon">🎁</div>
    <div class="info">
      <div class="name">奖励商店</div>
      <div class="desc">用智慧星兑换奖励 · 三个游戏的星星通用</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="card parent" href="parent-center.html">
    <div class="icon">👨‍👩‍👧</div>
    <div class="info">
      <div class="name">家长中心</div>
      <div class="desc">积分调整 · 奖励审核 · 每日时长 · 密码</div>
    </div>
    <div class="go">›</div>
  </a>

  <div class="foot">三个游戏共用一套智慧星 · 数据保存在本机浏览器<br/>离线也可玩：把 html 文件下载后双击打开</div>
</div>
<script src="sg-account.js"></script>
<script>
try{document.getElementById('bal').textContent=SG.refresh()}catch(e){}
</script>
</body>
</html>
